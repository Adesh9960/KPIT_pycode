<!-- _head_nav.html — <head> block, ambient background, and top app header/tab-nav bar shared by every tab -->
<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ECU Simulator Dashboard</title>
        <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
        <!-- global.css must load first: :root vars / theme base / shared
       components that the per-tab stylesheets below rely on -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/global.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/live.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/advanced.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/technician.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/programming.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/history.css') }}"
        />
    </head>

    <body class="mode-live">
        <div id="ambient-bg" aria-hidden="true">
            <span class="ambient-blob ambient-blob-a"></span>
            <span class="ambient-blob ambient-blob-b"></span>
            <span class="ambient-blob ambient-blob-c"></span>
        </div>

        <!-- ══════════════════════════════════════════════════
     HEADER
══════════════════════════════════════════════════ -->
        <header id="app-header">
            <div class="header-brand">
                <div class="brand-logo">
                    <img
                        src="{{ url_for('static', filename='img/team.png') }}"
                        alt="Team"
                        class="brand-logo-img logo-dark"
                    />
                    <img
                        src="{{ url_for('static', filename='img/team-light.png') }}"
                        alt="Team"
                        class="brand-logo-img logo-light"
                    />
                </div>

                <div class="brand-text">
                    <span class="brand-name">KPIT Technologies</span>
                    <span class="brand-sub">© KPIT APEX LABS</span>
                </div>
            </div>

            <nav class="tab-nav" id="tab-nav">
                <button
                    class="tab-btn active"
                    data-mode="live"
                    onclick="setMode('live')"
                    title="Live Dashboard"
                >
                    <svg class="tab-icon" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="3" fill="currentColor" />
                        <circle
                            cx="10"
                            cy="10"
                            r="7"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                            opacity="0.4"
                        />
                        <circle
                            cx="10"
                            cy="10"
                            r="9.5"
                            stroke="currentColor"
                            stroke-width="1"
                            fill="none"
                            opacity="0.2"
                        />
                    </svg>
                    <span class="live-dot"></span>
                    <span class="tab-label">Live</span>
                </button>

                <button
                    class="tab-btn"
                    data-mode="advanced"
                    onclick="setMode('advanced')"
                    title="Advanced User Mode"
                >
                    <svg class="tab-icon" viewBox="0 0 20 20" fill="none">
                        <path
                            d="M10 2L12.5 7H17.5L13.5 10.5L15 15.5L10 12.5L5 15.5L6.5 10.5L2.5 7H7.5L10 2Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <span class="tab-label">Advanced</span>
                </button>

                <!-- Technician tab — hidden until UDS session 0x10 0x03 -->
                <button
                    class="tab-btn tech-tab hidden"
                    id="tech-tab-btn"
                    data-mode="technician"
                    onclick="setMode('technician')"
                    title="Technician Mode — Extended Diagnostic Session"
                >
                    <svg class="tab-icon" viewBox="0 0 20 20" fill="none">
                        <path
                            d="M9 2H11V4.07A7 7 0 0 1 16.93 9H19V11H16.93A7 7 0 0 1 11 15.93V18H9V15.93A7 7 0 0 1 3.07 11H1V9H3.07A7 7 0 0 1 9 4.07V2Z"
                            stroke="currentColor"
                            stroke-width="1.4"
                            fill="none"
                        />
                        <circle cx="10" cy="10" r="2.5" fill="currentColor" />
                    </svg>
                    <span class="tab-label">Technician</span>
                    <span class="tech-badge">EXT</span>
                </button>

                <!-- Technician tab — hidden until UDS session 0x10 0x03 -->
                <button
                    class="tab-btn tech-tab hidden"
                    id="tech-tab-btn"
                    data-mode="technician"
                    onclick="setMode('technician')"
                    title="Technician Mode"
                >
                    <!-- ... (existing svg) ... -->
                    <span class="tab-label">Technician</span>
                    <span class="tech-badge">EXT</span>
                </button>

                <!-- PROGRAMMING TAB — strictly hidden until Security Access is granted -->
                <button
                    class="tab-btn prog-tab hidden"
                    id="prog-tab-btn"
                    data-mode="programming"
                    onclick="setMode('programming')"
                    title="Programming Mode — 0x10 0x02"
                >
                    <svg class="tab-icon" viewBox="0 0 20 20" fill="none">
                        <path
                            d="M10 2L18 6V14L10 18L2 14V6L10 2Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <span class="tab-label">Programming</span>
                    <span
                        class="tech-badge"
                        style="
                            background: rgba(255, 215, 64, 0.2);
                            color: var(--tech-amber);
                            border-color: rgba(255, 215, 64, 0.3);
                        "
                        >PRG</span
                    >
                </button>

                <button
                    class="tab-btn"
                    data-mode="history"
                    onclick="setMode('history')"
                    title="Signal History"
                >
                    <svg class="tab-icon" viewBox="0 0 20 20" fill="none">
                        <polyline
                            points="2,15 6,9 9,12 13,5 17,8"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                            stroke-linejoin="round"
                            stroke-linecap="round"
                        />
                        <line
                            x1="2"
                            y1="17"
                            x2="18"
                            y2="17"
                            stroke="currentColor"
                            stroke-width="1"
                            opacity="0.4"
                        />
                    </svg>
                    <span class="tab-label">History</span>
                </button>
            </nav>

            <div class="header-actions">
                <!-- UDS session status -->
                <div
                    class="uds-status"
                    id="uds-status"
                    title="UDS Session — type 0x10 0x03 to unlock Technician mode"
                >
                    <span class="uds-dot"></span>
                    <span class="uds-label" id="uds-label">DEFAULT</span>
                </div>
                <!-- TesterPresent heartbeat indicator — only visible in extended/programming session -->
                <div
                    class="tp-indicator hidden"
                    id="tp-indicator"
                    title="TesterPresent 0x3E heartbeat"
                >
                    <span class="tp-dot"></span>
                    <span class="tp-label">TP</span>
                </div>

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    onclick="toggleTheme()"
                    title="Toggle light/dark mode"
                    aria-label="Toggle theme"
                >
                    <svg class="theme-icon sun" viewBox="0 0 20 20" fill="none">
                        <circle
                            cx="10"
                            cy="10"
                            r="4"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                        <line
                            x1="10"
                            y1="1"
                            x2="10"
                            y2="3.5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="10"
                            y1="16.5"
                            x2="10"
                            y2="19"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="1"
                            y1="10"
                            x2="3.5"
                            y2="10"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="16.5"
                            y1="10"
                            x2="19"
                            y2="10"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="3.5"
                            y1="3.5"
                            x2="5.5"
                            y2="5.5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="14.5"
                            y1="14.5"
                            x2="16.5"
                            y2="16.5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="16.5"
                            y1="3.5"
                            x2="14.5"
                            y2="5.5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                        <line
                            x1="5.5"
                            y1="14.5"
                            x2="3.5"
                            y2="16.5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                    </svg>
                    <svg
                        class="theme-icon moon"
                        viewBox="0 0 20 20"
                        fill="none"
                    >
                        <path
                            d="M17 11.5A7.5 7.5 0 0 1 8.5 3a7.5 7.5 0 1 0 8.5 8.5z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                        />
                    </svg>
                </button>

                <div class="conn-pill" id="conn-pill">
                    <span class="conn-dot" id="conn-dot"></span>
                    <span id="conn-label">CONNECTING</span>
                </div>
                <span class="sys-time" id="sys-time">--:--:--</span>
            </div>
        </header>
